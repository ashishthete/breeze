<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <title>Breeze Cleaner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="drag"></div>
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h11a3 3 0 1 0-3-3"/><path d="M3 17h15a3 3 0 1 1-3 3"/><path d="M3 7h5"/></svg>
        </span>
        <div><b>Breeze Cleaner</b><small>1.0 · reversible cleanup</small></div>
      </div>
      <ul class="nav" id="nav"></ul>
      <div class="side-foot">
        <div class="store"><small id="storeLabel">Scanning disk…</small><div class="bar"><i id="storeBar"></i></div></div>
        <button class="theme-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="renderer.js"></script>
</body>
</html>
